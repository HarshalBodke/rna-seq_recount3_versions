name: Build and Push Docker Image to Seven Bridges

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Cache Docker build layers
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # Login to Seven Bridges Image Registry
      - name: Login to Seven Bridges Registry
        uses: docker/login-action@v3
        with:
          registry: images.sbgenomics.com
          username: ${{ secrets.SBG_USERNAME }}
          password: ${{ secrets.SBG_AUTH_TOKEN }}

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build -t images.sbgenomics.com/ts-sandbox/rna-seq_recount3_versions:latest .

      # Push Docker image
      - name: Push Docker image
        run: |
		  docker push images.sbgenomics.com/ts-sandbox/rna-seq_recount3_versions:latest
